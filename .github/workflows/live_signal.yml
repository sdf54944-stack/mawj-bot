name: Live Signal BTC
on:
  schedule:
    - cron: '15 */1 * * *'   # كل ساعة، الدقيقة 15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy
      - run: python live_signal.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
      - name: حفظ الحالة
        run: |
          git config user.name "bot"
          git config user.email "bot@github"
          git add state_BTC.json
          git commit -m "update BTC state" || echo "لا تغيير"
          git push
