name: Monthly Momentum Signal

on:
  schedule:
    - cron: '0 13 1 * *'
  workflow_dispatch:

jobs:
  run-momentum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run momentum signal and send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python momentum_telegram.py --top 10 --lookback 126 --capital 1000
